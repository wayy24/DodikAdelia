<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">

<!-- Agar aman di Android dan iPhone -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Undangan Pernikahan</title>

<style>

/* =========================
   RESET DASAR
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, sans-serif;
    overflow-x:hidden;
}


/* =========================
   SECTION UTAMA
   Setiap halaman full layar
========================= */

section{

    width:100%;
    height:100svh;

    display:flex;
    justify-content:center;
    align-items:center;

    text-align:center;

    background-size:cover;
    background-position:center;

    position:relative;
}


/* Overlay agar tulisan terlihat */

section::before{

    content:"";

    position:absolute;

    inset:0;

    background:rgba(0,0,0,0.35);

}


.container{

    position:relative;

    z-index:2;

    padding:20px;

}


/* =========================
   NAVIGASI BAWAH
========================= */


.bottom-nav{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:translateX(-50%);

    z-index:100;

    display:flex;

    gap:15px;

}


.bottom-nav button{

    width:45px;
    height:45px;

    border-radius:50%;

    border:none;

    background:white;

}


/* =========================
   BUTTON
========================= */

button{

    cursor:pointer;

}


/* =========================
   COUNTDOWN
========================= */

.countdown{

    display:flex;

    gap:10px;

    justify-content:center;

}


.time{

    background:white;

    padding:15px;

    border-radius:10px;

}


/* =========================
   FORM RSVP
========================= */


form{

    display:flex;

    flex-direction:column;

    gap:10px;

}


input,
textarea,
select{

    padding:12px;

    border-radius:5px;

    border:1px solid #ccc;

}



/* =========================
   AUDIO BUTTON
========================= */


.music-btn{

    position:fixed;

    top:20px;

    right:20px;

    z-index:100;

    width:45px;

    height:45px;

    border-radius:50%;

}


/* =========================
   MOBILE
========================= */


@media(max-width:600px){

    .countdown{

        gap:5px;

    }


    .time{

        padding:10px;

    }

}


</style>

</head>


<body>


<!-- =========================
 AUDIO BACKGROUND
 Ganti lagu.mp3 dengan file sendiri
========================= -->

<audio id="music" loop>

    <source src="audio/lagu.mp3" type="audio/mp3">

</audio>


<button class="music-btn" onclick="toggleMusic()">

    ▶

</button>

</section>
